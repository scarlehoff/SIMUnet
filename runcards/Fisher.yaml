# Labels used to produce bsm_names_to_latex for the Fisher plots.
bsm_plot_settings:
  OtW: {latex: '$c_{tW}$', plot_scale: 10}
  OtG: {latex: '$c_{tG}$', plot_scale: 10}
  O3pQ3: {latex: '$c_{\varphi Q}^{(3)}$', plot_scale: 1}
  O3pq: {latex: '$c_{\varphi q}^{(3)}$', plot_scale: 10}
  OpqMi: {latex: '$c_{\varphi q}^{(-)}$', plot_scale: 1}
  Opui: {latex: '$c_{\varphi u}$', plot_scale: 1}
  Opdi: {latex: '$c_{\varphi d}$', plot_scale: 1}
  O3pl: {latex: '$c_{\varphi l}^{(3)}$', plot_scale: 10}
  Opl: {latex: '$c_{\varphi l}$', plot_scale: 10}
